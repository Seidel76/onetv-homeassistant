# The add-on version IS the OneTV Server version: the Dockerfile downloads
# https://onetvconnect.com/server/dl/<version>/ (bump here to ship an update).
name: OneTV Server
version: "1.0.33"
slug: onetv_server
description: TV recording server for OneTV Connect (iPhone, iPad, Apple TV, Mac).
url: https://onetvconnect.com/server/
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: services
boot: auto
# mDNS/Bonjour discovery and the UDP discovery port need the host network.
host_network: true
ingress: true
ingress_port: 8099
panel_icon: mdi:record-rec
panel_title: OneTV Server
watchdog: tcp://[HOST]:47820
hassio_api: false
homeassistant_api: false
map:
  - type: media
    read_only: false
  - type: share
    read_only: false
options:
  recordings_path: /media/OneTV
  name: ""
schema:
  recordings_path: match(^/(media|share)(/.*)?$)
  name: str?
# Informational with host_network: the server listens directly on the host.
ports:
  47820/tcp: 47820
  47823/udp: 47823
  47824/udp: 47824
ports_description:
  47820/tcp: OneTV Connect API (HTTPS)
  47823/udp: Discovery
  47824/udp: Access away from home (direct encrypted connection)
